[environment]
# Used by GameASG environment/export utilities; pass --bench to stage commands.
# GAMEASG_BENCH_ROOT = "/absolute/path/to/GameASG-Bench"
GAMECRAFT_BENCH_ROOT = "/absolute/path/to/GameCraft-Bench"
GAMECRAFT_BENCH_GODOT_BIN = "/absolute/path/to/godot"
CODEX_BIN = "codex"
LLM_BACKEND = "codex"
OPTIMIZER_BACKEND = "codex"
GAMECRAFT_CODEX_PROVIDER = "openai"
GAMECRAFT_PLAYER_BACKEND = "codex"
GAMECRAFT_PLAYER_MODEL = "gpt-6-sol"
GAMECRAFT_JUDGE_BACKEND = "codex"
GAMECRAFT_JUDGE_MODEL = "gpt-6-sol"
H3_BACKEND = "local"
H3_URL = "http://127.0.0.1:30010"
# Effective Craft material job timeout (includes server-side queue time).
GAMECRAFT_H3_JOB_TIMEOUT_SECONDS = "3600"
# GameASG overrides the worker timeout via --h3-timeout; pass --h3-url explicitly.
LOCAL_URL = "http://127.0.0.1:30020/v1"
# Use a Python environment with the Play2Evolve package and media dependencies.
# GAMECRAFT_ASSET_PYTHON = "/absolute/path/to/venv/bin/python"

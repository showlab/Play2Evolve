[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "play2evolve"
version = "0.1.0"
description = "Godot and browser game generation and iterative evolution through playtesting, code editing, and video generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["openai>=1.55", "httpx>=0.27", "numpy>=1.26", "Pillow>=10", "opencv-python-headless>=4.9", "imageio>=2.34", "imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
play2evolve = "play2evolve.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["codex_provider", "llm", "gen_assets", "game_spec", "h3_minimax_api", "wan_video_backend"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"*" = ["*.gd", "*.js", "*.json", "*.txt", "cases/**/*.gd", "cases/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

